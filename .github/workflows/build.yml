name: Build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Téléchargement direct avec curl et tar (contourne les erreurs Git)
      - name: Download EADK
        run: |
          curl -L -o eadk.tar.gz https://api.github.com/repos/numworks/eadk/tarball
          mkdir -p eadk
          tar -xzf eadk.tar.gz -C eadk --strip-components=1

      - name: Install toolchain
        uses: numworks/setup-arm-toolchain@latest
        
      - name: Run make build
        run: make build

      - name: Upload nwa artifact
        uses: actions/upload-artifact@v4
        with:
          name: demineur-nwa  # J'ai renommé l'artefact pour que ça corresponde à ton jeu
          path: output/app.nwa

      - name: Run make check
        run: make check
